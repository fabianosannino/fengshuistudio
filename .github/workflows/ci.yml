name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gate: quebram o CI se falharem.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
      - name: Verify pinned ephemeris
        run: npm run test:ephemeris

      # Passou a bloquear: os erros foram a zero. As poucas exceções que restam
      # são supressões por sítio, com a razão escrita ao lado — nova violação
      # quebra o build em vez de virar mais uma linha no relatório.
      - name: Lint (erros)
        run: npm run lint

      # Build sem dados ou credenciais reais. Nenhum job de PR acessa produção.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
          NEXT_PUBLIC_APP_URL: https://example.invalid

  security:
    name: Authorization & catalog (PostgreSQL + PostgREST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reproduzir falhas e verificar a migração em banco descartável
        run: npm run test:security
      - name: Verificar migração do catálogo e isolamento dos buckets
        run: npm run test:catalog-migration
      - name: Verificar cotas, reativação e concorrência no PostgreSQL
        run: npm run test:plan-quotas
      - name: Verificar consumo atomico de chaves e concessoes
        run: npm run test:plan-grants
      - name: Verificar concorrencia e retomada dos webhooks
        run: npm run test:webhook-claims
      - name: Verificar exclusao e uploads concorrentes
        run: npm run test:privacy-deletion
      - name: Verificar limite atomico e expiracao em Redis isolado
        run: npm run test:rate-limit

  quality:
    name: Dependency Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit de dependências
        run: npm audit --audit-level=high
