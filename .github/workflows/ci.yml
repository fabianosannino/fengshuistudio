name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gate: quebram o CI se falharem.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # Passou a bloquear: os erros foram a zero. As poucas exceções que restam
      # são supressões por sítio, com a razão escrita ao lado — nova violação
      # quebra o build em vez de virar mais uma linha no relatório.
      - name: Lint (erros)
        run: npm run lint

  quality:
    name: Audit (informativo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Informativo: reporta débito conhecido sem bloquear o merge.
      - name: Audit de dependências
        run: npm audit --audit-level=high
        continue-on-error: true
