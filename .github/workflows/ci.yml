name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gate: quebram o CI se falharem.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  quality:
    name: Lint & Audit (informativo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Informativo: reportam débito conhecido sem bloquear o merge.
      # Ver docs/auditoria/ para o plano de zerar os erros de lint.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Audit de dependências
        run: npm audit --audit-level=high
        continue-on-error: true
